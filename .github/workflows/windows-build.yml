name: windows-build

# Real Windows 11 (x64) build of Creative Pic, following KDE's official
# Krita Windows CI recipe (build-tools/ci-scripts/windows.yml in the
# krita-5.2.16 sources):
#   - MSVC compile on a Windows runner (no cross-compilation)
#   - prebuilt dependency packages from KDE's public artifact registry
#     (invent.kde.org teams/ci-artifacts/krita-windows) fetched through
#     KDE's own ci-utilities (run-ci-build.py)
#   - Creative Pic branding overlay applied to the source before compile
#     (windows/apply-branding.ps1: splash, icons, theme, workspace,
#     window/about titles, NSIS product name)
#   - portable .zip + NSIS setup .exe, attached to the v0.2 release
#     (unsigned — no code-signing certificate exists; documented)
on:
  push:
    paths:
      - ".github/workflows/windows-build.yml"
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      # --- KDE CI tooling environment (mirrors krita's windows.yml) ---
      KDECI_BUILD_TYPE: RelWithDebInfo
      KDECI_ONLY_BUILD: "True" # prebuilt deps are fetched, not rebuilt
      KDECI_GITLAB_SERVER: https://invent.kde.org/
      KDECI_PACKAGE_PROJECT: teams/ci-artifacts/krita-windows
      KDECI_REPO_METADATA_PATH: ${{ github.workspace }}\krita-deps-management\repo-metadata
      # NOTE: runner.temp is not available in job-level env, so the three
      # cache/workdir paths are set in the build step's env below.
      KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD: "False"
      # NOTE: KDECI_EXTRA_CMAKE_ARGS is set inside the build step (it must
      # include the venv python path, which only exists at build time).
      # --- krita packaging environment (mirrors krita's windows-release) ---
      KRITACI_SKIP_DEBUG_PACKAGE: "True" # huge -dbg zip is not shipped here
      KRITACI_BUILD_INSTALLERS: "True" # build the NSIS setup .exe
      KRITACI_RELEASE_PACKAGE_NAMING: "True" # krita-x64-5.2.16 (no sha suffix)
      # NOTE: KRITACI_WINDOWS_SIGN_CONFIG is intentionally NOT set —
      # there is no code-signing certificate, and build-windows-package.py
      # then skips signing gracefully (upstream-documented behaviour).
      PYTHONUTF8: "1"

    steps:
      - name: Checkout Creative Pic repository
        uses: actions/checkout@v4

      # NOTE: no MSVC environment — the prebuilt KDE deps for this branch are
      # built with clang (llvm-mingw family: GNU-style .a import libraries,
      # libc++ runtime), so krita is compiled with the same clang toolchain
      # (see the build step; run #10 diagnosis: MSVC link.exe cannot consume
      # the GNU import libraries).

      - name: Use Python 3.10 (the krita-5.2 deps line is built against python310)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packaging tools (ninja, nsis)
        run: choco install ninja nsis -y --no-progress
        shell: pwsh

      - name: Download and verify Krita 5.2.16 source
        shell: pwsh
        run: |
          $expected = "3bd3bf786be78185a9d93cca14a9d5f2dcdc227e895d8f5fc836a04b2f2ed875"
          $url = "https://github.com/PSNarayananmc/CreativeStudio-Ultimate-Full/releases/download/v0.2/krita-5.2.16.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile krita-5.2.16.tar.xz
          $hash = (Get-FileHash krita-5.2.16.tar.xz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $expected) {
            Write-Host "hash mismatch ($hash), falling back to download.kde.org"
            Invoke-WebRequest -Uri "https://download.kde.org/stable/krita/5.2.16/krita-5.2.16.tar.xz" -OutFile krita-5.2.16.tar.xz
            $hash = (Get-FileHash krita-5.2.16.tar.xz -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $expected) { throw "SHA-256 verification FAILED: $hash" }
          }
          Write-Host "SHA-256 verified: $hash"
          tar -xf krita-5.2.16.tar.xz

      - name: Init source git repo (CI tooling requires one)
        shell: pwsh
        working-directory: krita-5.2.16
        run: |
          git init -b master
          git config user.name "creative-pic-ci"
          git config user.email "ci@creative-pic.invalid"
          git add -A
          git commit -q -m "krita 5.2.16 baseline (verified tarball)"

      - name: Apply Creative Pic branding overlay (source patch + assets)
        shell: pwsh
        run: |
          $src = Join-Path (Get-Location) "krita-5.2.16"
          # the script throws on its own on any failure (ErrorActionPreference
          # = Stop); $LASTEXITCODE is not set by cmdlet-only scripts
          & ".\windows\apply-branding.ps1" -KritaSrc $src
          if (-not (Test-Path "krita-5.2.16\libs\ui\KisApplication.cpp")) { throw "krita source missing after overlay" }

      - name: Commit branding overlay into source repo
        shell: pwsh
        working-directory: krita-5.2.16
        run: |
          git add -A
          git commit -q -m "Creative Pic branding overlay"

      - name: Clone KDE CI tooling (deps recipes + ci-utilities)
        shell: pwsh
        run: |
          git clone --depth=1 -b krita/5.2 https://invent.kde.org/packaging/krita-deps-management.git
          git clone --depth=1 https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management\ci-utilities

      - name: Build Krita / Creative Pic (fetch prebuilt deps, cmake+ninja, MSVC)
        shell: pwsh
        working-directory: krita-5.2.16
        env:
          KDECI_CACHE_PATH: ${{ runner.temp }}\krita-package-cache
          KDECI_CC_CACHE: ${{ runner.temp }}\krita-ccache
          KDECI_WORKDIR_PATH: ${{ runner.temp }}\krita-workdir
        run: |
          # Force FindPython to the venv interpreter: setup-python exports
          # Python3_ROOT_DIR pointing at the base 3.10 install, and CMake's
          # FindPython then prefers it over the activated venv — the base
          # python lacks the venv's modules (packaging) that the deps'
          # sipbuild needs (run #6 diagnosis). The compiler pins select the
          # llvm-mingw clang (run #10: the deps ship GNU-style import libs
          # and a libc++ runtime — MSVC is ABI-incompatible with them).
          $env:KDECI_REPO_METADATA_PATH = "$(Get-Location)\..\krita-deps-management\repo-metadata"
          python -m venv venv --upgrade-deps
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          # the deps' requirements.txt is --require-hashes pinned: it MUST be
          # installed alone. Extras go in a separate invocation: packaging is
          # needed by the deps' sipbuild; cmake==3.31.6 is era-correct (the
          # runner's 4.4 breaks FindLibExiv2 + Qt5::Core imported-target
          # resolution against these 3.x-era dep configs)
          pip install -r ..\krita-deps-management\requirements.txt
          pip install packaging "cmake==3.31.6"
          # Python 3.8+ ignores PATH when resolving DLL dependencies of .pyd
          # extension modules; the KDE deps layout puts every DLL in
          # _install\bin (which IS on PATH). Restore pre-3.8 behavior for all
          # python processes of this venv via sitecustomize (documented).
          $sc = @(
            'import os',
            "for _d in os.environ.get('PATH', '').split(os.pathsep):",
            '    if _d and os.path.isdir(_d):',
            '        try:',
            '            os.add_dll_directory(_d)',
            '        except OSError:',
            '            pass'
          )
          Set-Content .\venv\Lib\site-packages\sitecustomize.py ($sc -join "`r`n") -NoNewline
          python -u ..\krita-deps-management\tools\replace-branch-in-seed-file.py ..\krita-deps-management\latest\krita-deps.yml -p -o branch-corrected-deps.yml -d master
          python -u ..\krita-deps-management\tools\generate-deps-file.py -s branch-corrected-deps.yml -o .kde-ci.yml
          # ccache is disabled for this runner: cold cache would give no speedup
          # and cl-integration is tuned for KDE's own VM images (documented)
          (Get-Content .kde-ci.yml -Raw) -replace 'use-ccache: True', 'use-ccache: False' | Set-Content .kde-ci.yml -NoNewline
          # exiv2 0.28.x deps ship the import library as lib/libexiv2.dll.a,
          # but krita 5.2's FindLibExiv2.cmake searches exiv2/libexiv2 with
          # standard suffixes only. Teach this module the .dll.a suffix
          # (documented build-environment compatibility patch).
          $fx = "cmake\modules\FindLibExiv2.cmake"
          $fc = Get-Content $fx -Raw
          $fc = $fc.Replace('find_library(LibExiv2_LIBRARIES NAMES exiv2 libexiv2', "list(APPEND CMAKE_FIND_LIBRARY_SUFFIXES `".dll.a`")`r`nfind_library(LibExiv2_LIBRARIES NAMES exiv2 libexiv2")
          Set-Content $fx $fc -NoNewline

          # Backport upstream commit cc113e991c "Remove our own redifinition
          # of std::is_integral for half" (krita master, 2024-12-05): the
          # libc++ that ships with clang 21 removed the internal
          # __libcpp_is_integral/__libcpp_is_floating_point hooks that krita
          # 5.2.16's KisHalfTraits.h specializes. This is upstream's own fix,
          # needed to compile the 5.2.16 tag against the current toolchain.
          $fh = "libs\global\KisHalfTraits.h"
          $ch = Get-Content $fh -Raw
          $ch = $ch -replace '(?s)#if defined __GLIBCXX__.*?#endif\r?\n\r?\n  inline bool', "  inline bool"
          if ($ch.Contains('__libcpp_is_integral')) { throw "KisHalfTraits backport did not apply" }
          Set-Content $fh $ch -NoNewline
          $fm = "libs\pigment\KoMixColorsOpImpl.h"
          $cm = Get-Content $fm -Raw
          $cm = $cm.Replace('std::enable_if_t<std::is_floating_point<T>::value, T> divisor', 'std::enable_if_t<!std::numeric_limits<T>::is_integer, T> divisor')
          $cm = $cm.Replace('std::enable_if_t<std::is_integral<T>::value, T> divisor', 'std::enable_if_t<std::numeric_limits<T>::is_integer, T> divisor')
          if ($cm.Contains('std::is_floating_point<T>::value')) { throw "KoMixColorsOpImpl backport did not apply" }
          Set-Content $fm $cm -NoNewline

          # ---- phase 1: fetch + merge the prebuilt deps only ----
          python -u ..\krita-deps-management\ci-utilities\run-ci-build.py --project krita --branch master --platform Windows/Qt5/Shared --skip-publishing --only-deps 2>&1 | Tee-Object -FilePath deps-fetch.log
          if ($LASTEXITCODE -ne 0) { throw "deps fetch failed (see deps-fetch.log artifact)" }

          # ---- phase 2: provide the clang runtime DLLs the deps were built against ----
          # KDE's deps (icu, qt, ...) are clang-built and import libc++.dll +
          # libunwind.dll, which live in KDE's own VM image, not in any
          # package. Provide them from a pinned llvm-mingw release into
          # _install\bin (same-dir resolution then fixes QtCore.pyd imports
          # AND the AUTORCC rcc.exe test — run #8 diagnosis).
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20251118/llvm-mingw-20251118-ucrt-x86_64.zip" -OutFile ..\llvm-mingw.zip
          Expand-Archive ..\llvm-mingw.zip -DestinationPath ..\llvm-mingw
          $lmBin = Join-Path (Get-Location).Path "..\llvm-mingw\llvm-mingw-20251118-ucrt-x86_64\bin"
          $lmBin = [System.IO.Path]::GetFullPath($lmBin)
          # clang toolchain FIRST on PATH so CMake/Ninja use it (not the
          # preinstalled MSVC-targeting LLVM clang — run #11: a relative PATH
          # entry broke tool resolution from other working directories)
          $env:PATH = "$lmBin;$env:PATH"
          clang --version | Select-Object -First 1
          $installBin = Join-Path $env:KDECI_WORKDIR_PATH "krita\_install\bin"
          Copy-Item (Join-Path $lmBin "..\x86_64-w64-mingw32\bin\libc++.dll"), (Join-Path $lmBin "..\x86_64-w64-mingw32\bin\libunwind.dll") $installBin -Force
          Get-ChildItem (Join-Path $installBin "libc++.dll"), (Join-Path $installBin "libunwind.dll") | Format-Table Name, Length
          # cmake args must come after the toolchain exists: absolute compiler
          # paths + venv python (FindPython pin)
          $venvPy = Join-Path (Get-Location).Path "venv\Scripts\python.exe"
          $env:KDECI_EXTRA_CMAKE_ARGS = "-DHIDE_SAFE_ASSERTS=ON -DBUILD_TESTING=OFF -DPython_EXECUTABLE=$venvPy -DPython3_EXECUTABLE=$venvPy -DCMAKE_C_COMPILER=$lmBin\clang.exe -DCMAKE_CXX_COMPILER=$lmBin\clang++.exe"

          # ---- phase 3: configure + compile + install (deps already merged) ----
          python -u ..\krita-deps-management\ci-utilities\run-ci-build.py --project krita --branch master --platform Windows/Qt5/Shared --skip-publishing --skip-dependencies-fetch 2>&1 | Tee-Object -FilePath build-krita.log
          if ($LASTEXITCODE -ne 0) { throw "krita build failed (see build-krita.log artifact)" }

      - name: Package portable zip + NSIS setup exe
        shell: pwsh
        working-directory: krita-5.2.16
        run: |
          python -u build-tools\ci-scripts\build-windows-package.py 2>&1 | Tee-Object -FilePath build-installers.log
          if ($LASTEXITCODE -ne 0) { throw "packaging failed (see build-installers.log artifact)" }
          Get-ChildItem -File | Where-Object Name -like "krita-x64-5.2.16*" | Format-Table Name, Length

      - name: Rename packages to Creative Pic
        shell: pwsh
        working-directory: krita-5.2.16
        run: |
          if (Test-Path krita-x64-5.2.16.zip) {
            Copy-Item krita-x64-5.2.16.zip CreativePic-x64-5.2.16-portable.zip
            Write-Host "portable: CreativePic-x64-5.2.16-portable.zip"
          } else { Write-Host "::warning:: portable zip missing" }
          if (Test-Path krita-x64-5.2.16-setup.exe) {
            Copy-Item krita-x64-5.2.16-setup.exe CreativePic-x64-5.2.16-setup.exe
            Write-Host "installer: CreativePic-x64-5.2.16-setup.exe"
          } else { Write-Host "::warning:: setup exe missing" }

      - name: Upload raw build logs (diagnosis artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            krita-5.2.16/build-krita.log
            krita-5.2.16/build-installers.log
          if-no-files-found: ignore

      - name: Upload packages (workflow artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            krita-5.2.16/CreativePic-x64-5.2.16-portable.zip
            krita-5.2.16/CreativePic-x64-5.2.16-setup.exe
          if-no-files-found: warn

      - name: Attach packages to v0.2 release
        if: success()
        shell: pwsh
        working-directory: krita-5.2.16
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @()
          if (Test-Path CreativePic-x64-5.2.16-portable.zip) { $files += "CreativePic-x64-5.2.16-portable.zip" }
          if (Test-Path CreativePic-x64-5.2.16-setup.exe) { $files += "CreativePic-x64-5.2.16-setup.exe" }
          if ($files.Count -gt 0) {
            gh release upload v0.2 @files --clobber --repo $env:GITHUB_REPOSITORY
            Write-Host "attached to release v0.2: $($files -join ', ')"
          } else {
            throw "no packages produced"
          }
